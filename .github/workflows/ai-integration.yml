name: ai-integration-checks

on:
  push:
    branches:
      - feature/ai-investigation-inference
  pull_request:
    paths:
      - 'internal/ai/**'
      - 'internal/subs/**'
      - 'cmd/amass-ai-mcp/**'
      - 'cmd/amass-ai-mcp-http/**'
      - 'cmd/amass-ai-classifier/**'
      - 'cmd/amass-ai-classifier-train/**'
      - 'cmd/amass-ai-provider-health/**'
      - 'cmd/amass/main.go'
      - 'Dockerfile'
      - '.github/workflows/ai-integration.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: AI, configuration and CLI tests
        run: go test -race ./config ./internal/ai/... ./cmd/amass ./cmd/amass-ai-mcp
      - name: Default evidence-first classifier regression
        run: go test ./internal/ai ./internal/ai/classify ./internal/ai/cli -run "TestDefaultEvidenceClassifier|TestHTTPClassifier|TestClassifierServiceEndpointGuard|TestTrainer" -count=1
      - name: FQDN inventory and subdomain summary regressions
        run: go test ./internal/subs ./internal/ai -run "TestAddInfrastructureInfoPreservesDiscoveredNamesWithoutASNs|TestFQDNInventory" -count=1
      - name: Schema-grounded typed intent and language-alias regressions
        run: go test ./internal/ai -run "TestTypedRelationIntent|TestOAMIntent|TestSubdomainIntent|TestRelationAlias|TestRelationshipAndFieldVocabulary" -count=1
      - name: Build all Amass executables
        # Amass uses libpostal behind CGO; production Docker builds disable CGO.
        # Race-enabled AI tests above intentionally continue to use CGO.
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Vet AI integration
        run: go vet ./internal/ai/... ./cmd/amass ./cmd/amass-ai-mcp

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build development image (no publish)
        run: docker build -t amass-ai:ci .
      - name: Verify expected binaries
        run: |
          docker run --rm --entrypoint /bin/sh amass-ai:ci -c 'test -x /bin/amass && test -x /bin/amass-ai-mcp'

  paired-assetdb:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: owasp-amass/asset-db
          ref: feature/ai-investigation-inference
          path: asset-db
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify against bounded-query Asset Database branch
        run: |
          go mod edit -replace=github.com/owasp-amass/asset-db=./asset-db
          go test -v ./internal/ai/oamrepo -run '^TestAdapterBoundedTraversalOnSQLite$' -count=1
          go test ./config ./internal/ai/...
