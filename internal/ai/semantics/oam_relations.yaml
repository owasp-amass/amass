     note: "RDAP service of the registry."}
  - {source: AutnumRecord, label: registrant, relation_type: SimpleRelation, destination: ContactRecord,
     attribution: controller, purpose: registration,
     note: "Registrant of the AS number (used by engine scope association). Owner of the address space; when reached from an FQDN through DNS it is the hosting network, not the FQDN owner."}
  - {source: AutnumRecord, label: technical_contact, relation_type: SimpleRelation, destination: ContactRecord,
