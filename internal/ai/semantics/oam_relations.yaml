# Meaning of every Open Asset Model relationship, for AI investigations.
#
# STATUS: reviewed by the maintainer (2026-11-09). Owner questions use the
# attribution field; see internal/ai/ownership.go.
#
# Keyed exactly like OAM's own relationship table (source, label,
# relation_type, destination) so it can move into open-asset-model
# unchanged. A test fails when OAM defines a relationship missing here.
#
# attribution - what the edge says about who controls the SOURCE asset:
#   controller     the destination identifies a party that controls the source
#                  (domain registrant, certificate subject)
#   controls       the source party controls the destination
#                  (an organization's website, a parent's subsidiary)
#   same_subject   the destination is the same subject in another form;
#                  attribution passes through (FQDN to its domain record)
#   shared         the destination may be shared with unrelated parties;
#                  attribution does NOT pass through (certificate SANs)
#   infrastructure technical dependency such as DNS resolution or routing;
#                  reaches hosts and networks, not owners
#   third_party    the destination is a separate provider, issuer, registrar
#                  or operator
#   attribute      descriptive data (identifiers, addresses, phones)
#
# vendor - optional, third_party only. false marks a destination that is
#   registry or protocol infrastructure (abuse desks, RDAP, WHOIS and OCSP
#   endpoints, issuing CA certificates), not a party the source chose to
#   depend on. The third-party lens skips these edges.
#
# purpose - the kind of question the edge helps answer:
#   registration certificate corporate contact network dns web identity
#   financial product hierarchy
#
# reviewed: true marks an edge whose role varies in practice; the
# maintainer confirmed the value shown. Mark a changed or new uncertain
# edge review: true until it is decided.

version: 1
relations:
  - {source: Account, label: id, relation_type: SimpleRelation, destination: Identifier,
     attribution: attribute, purpose: identity,
     note: "Identifier of the account."}
  - {source: Account, label: user, relation_type: SimpleRelation, destination: Organization,
     attribution: controller, purpose: identity, reviewed: true,
     note: "The Person or Organization that uses the account; usually its controller, but a shared or delegated account can have other users."}
  - {source: Account, label: user, relation_type: SimpleRelation, destination: Person,
     attribution: controller, purpose: identity, reviewed: true,
     note: "The Person or Organization that uses the account; usually its controller, but a shared or delegated account can have other users."}
  - {source: AutnumRecord, label: abuse_contact, relation_type: SimpleRelation, destination: ContactRecord,
     attribution: third_party, purpose: registration, vendor: false,
     note: "Abuse handling contact; frequently a provider or registry service desk."}
  - {source: AutnumRecord, label: admin_contact, relation_type: SimpleRelation, destination: ContactRecord,
     attribution: controller, purpose: registration, reviewed: true,
     note: "Administrative contact for the AS number; usually the registrant organization, sometimes an agent."}
  - {source: AutnumRecord, label: rdap_url, relation_type: SimpleRelation, destination: URL,
