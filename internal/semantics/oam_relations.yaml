     note: "The certificate authority that issued the certificate."}
  - {source: TLSCertificate, label: issuing_certificate_url, relation_type: SimpleRelation, destination: URL,
     attribution: third_party, purpose: certificate, vendor: false,
     note: "Where the issuing CA certificate is published."}
  - {source: TLSCertificate, label: issuing_certificate, relation_type: SimpleRelation, destination: TLSCertificate,
     attribution: third_party, purpose: certificate, vendor: false,
     note: "The issuing CA certificate."}
  - {source: TLSCertificate, label: ocsp_server, relation_type: SimpleRelation, destination: URL,
     attribution: third_party, purpose: certificate, vendor: false,
     note: "The CA's revocation service."}
  - {source: TLSCertificate, label: san_dns_name, relation_type: SimpleRelation, destination: FQDN,
     attribution: shared, purpose: certificate,
     note: "A subject alternative name. One certificate can cover many unrelated parties (CDN and hosting certificates), so SANs do not carry ownership; engine scope association does not use them."}
  - {source: TLSCertificate, label: san_email_address, relation_type: SimpleRelation, destination: Identifier,
     attribution: shared, purpose: certificate,
     note: "A subject alternative email address. One certificate can cover many unrelated parties (CDN and hosting certificates), so SANs do not carry ownership; engine scope association does not use them."}
  - {source: TLSCertificate, label: san_ip_address, relation_type: SimpleRelation, destination: IPAddress,
     attribution: shared, purpose: certificate,
     note: "A subject alternative address. One certificate can cover many unrelated parties (CDN and hosting certificates), so SANs do not carry ownership; engine scope association does not use them."}
  - {source: TLSCertificate, label: san_url, relation_type: SimpleRelation, destination: URL,
     attribution: shared, purpose: certificate,
     note: "A subject alternative URL. One certificate can cover many unrelated parties (CDN and hosting certificates), so SANs do not carry ownership; engine scope association does not use them."}
  - {source: TLSCertificate, label: subject_contact, relation_type: SimpleRelation, destination: ContactRecord,
     attribution: controller, purpose: certificate,
     note: "Certificate subject (engine scope association). Names the organization for OV/EV certificates; DV certificates usually have none."}
  - {source: URL, label: contact, relation_type: SimpleRelation, destination: ContactRecord,
     attribution: attribute, purpose: contact,
     note: "Contact information the page or file at the URL publishes (a security.txt file's contacts and links, an ads.txt file's owner domain and contact). What it names may belong to the publisher, a parent company or an agency, so control does not flow through it; the lenses weigh it."}
  - {source: URL, label: domain, relation_type: SimpleRelation, destination: FQDN,
     attribution: same_subject, purpose: web,
     note: "The host of the URL; controlled by the same party for first-party URLs."}
  - {source: URL, label: file, relation_type: SimpleRelation, destination: File,
     attribution: attribute, purpose: web,
     note: "Content retrieved from the URL."}
  - {source: URL, label: ip_address, relation_type: SimpleRelation, destination: IPAddress,
     attribution: infrastructure, purpose: network,
     note: "The address the URL host resolved to."}
  - {source: URL, label: port, relation_type: PortRelation, destination: Service,
     attribution: infrastructure, purpose: network,
     note: "Service serving the URL."}
  - {source: URL, label: fingerprint, relation_type: SimpleRelation, destination: Identifier,
     attribution: attribute, purpose: web, reviewed: true,
     note: "A fingerprint of the page at this URL (for example an analytics identifier), as a shared Identifier whose id_type names the kind and whose id is the value; see the Service fingerprint relation. Descriptive of the page, so ownership does not pass through."}
