  - {source: Service, label: certificate, relation_type: SimpleRelation, destination: TLSCertificate,
     attribution: same_subject, purpose: certificate,
     note: "Certificate presented by the service (engine scope association)."}
  - {source: Service, label: fingerprint, relation_type: SimpleRelation, destination: Identifier,
     attribution: attribute, purpose: web, reviewed: true,
     note: "A fingerprint of what the service served, as a shared Identifier whose id_type names the kind (favicon_mmh3, JARM, http_title, body_sha256, analytics_id, ssh_host_key) and whose id is the value. It is a descriptive attribute of the service, not an asset it owns; services and hosts carrying the same value share the one Identifier, so the ownership-gap lens pivots on them as a supporting signal. A value can be shared by unrelated parties (a CDN favicon, a templated title), so ownership does not pass through."}
  - {source: Service, label: product_used, relation_type: SimpleRelation, destination: Product,
     attribution: third_party, purpose: product,
     note: "Software the service runs; points to the vendor's product, not the service owner."}
  - {source: Service, label: product_used, relation_type: SimpleRelation, destination: ProductRelease,
     attribution: third_party, purpose: product,
     note: "Software the service runs; points to the vendor's product, not the service owner."}
  - {source: Service, label: provider, relation_type: SimpleRelation, destination: Organization,
     attribution: third_party, purpose: network,
     note: "The organization providing the service, such as a cloud or SaaS vendor. It operates the service but does not own the customer's assets."}
  - {source: Service, label: terms_of_service, relation_type: SimpleRelation, destination: File,
     attribution: attribute, purpose: web,
     note: "Terms of service document."}
  - {source: Service, label: terms_of_service, relation_type: SimpleRelation, destination: URL,
     attribution: attribute, purpose: web,
     note: "Terms of service document."}
  - {source: Service, label: onion_location, relation_type: SimpleRelation, destination: URL,
     attribution: same_subject, purpose: web,
     note: "Tor onion address the service advertises for itself in its Onion-Location response header."}
  - {source: Service, label: content_source, relation_type: SimpleRelation, destination: FQDN,
     attribution: third_party, purpose: web,
     note: "Host the service's Content-Security-Policy lets it load scripts, frames, connections or other content from."}
  - {source: Service, label: allowed_origin, relation_type: SimpleRelation, destination: FQDN,
     attribution: shared, purpose: web,
     note: "Origin the service's CORS Access-Control-Allow-Origin or CSP frame-ancestors lets call or embed it; often a sibling site, sometimes a partner."}
  - {source: Service, label: report_endpoint, relation_type: SimpleRelation, destination: URL,
     attribution: third_party, purpose: web,
     note: "Endpoint the service sends browser reports to (CSP report-uri, Report-To, Reporting-Endpoints, NEL)."}
  - {source: StorageBucket, label: provider, relation_type: SimpleRelation, destination: Organization,
     attribution: third_party, purpose: network,
     note: "The cloud provider that operates the bucket's global namespace (Amazon Web Services, Google Cloud, Microsoft Azure). It hosts the bucket but does not own the customer's data."}
  - {source: StreetAddress, label: geolocation, relation_type: SimpleRelation, destination: GeoLocation,
     attribution: attribute, purpose: contact,
     note: "The position of the street address."}
