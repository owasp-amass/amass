# A legacy Amass 3.x INI configuration
mode = passive

[resolvers]
resolver = 8.8.8.8
resolver = 1.1.1.1
resolver = 8.8.8.8

[scope]
address = 192.0.2.1
address = 192.0.2.2
cidr = 198.51.100.0/24
asn = 64496
asn = 64497
asn = 64496
asn = notanumber
port = 80
port = 443

[scope.domains]
domain = example.com
domain = example.org
domain = example.com
domain = localhost
domain = bad..example

[scope.blacklisted]
subdomain = internal.example.com
subdomain = internal.example.com

[graphdbs]
[graphdbs.postgres]
primary = true
url = postgres://amass:secret@127.0.0.1:5432/assetdb

[bruteforce]
enabled = true
wordlist_file = /words/names.txt

[alterations]
enabled = false

[data_sources]
minimum_ttl = 1440

[data_sources.Shodan]
ttl = 60
[data_sources.Shodan.Credentials]
apikey = shodan-key

[data_sources.Censys]
[data_sources.Censys.Credentials]
apikey = censys-id
secret = censys-secret

[data_sources.AlienVault]
ttl = 4320

[data_sources.disabled]
data_source = Crtsh
